version: '3' 
services: 
    mongodb: 
        image: mongo:latest 
        container_name: student-mongo 
        ports: 
        # host : container
        - "27017:27017" 
        # Khi tắt docker -> container bị xoá -> mất hết data nếu ko volume
        volumes: 
        - ./mongodbdata:/data/db